<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>강의 문의 관리 | 안성맞춤 릴리맘</title><style>
:root{--navy:#182B49;--mint:#21B6A8}*{box-sizing:border-box}body{font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;margin:0;background:#f5f8fc;color:#22344c;font-size:16px;line-height:1.65}header{background:var(--navy);color:#fff;padding:20px clamp(18px,5vw,65px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}header a{color:#d6e9fa}main{max-width:1180px;margin:auto;padding:40px 20px 100px}h1{font-size:clamp(26px,3vw,38px);margin:0 0 12px}h2{margin:0 0 15px}p{color:#52657d}.panel{background:#fff;border:1px solid #dbe6ef;border-radius:22px;padding:clamp(20px,3vw,34px);margin:20px 0;box-shadow:0 10px 30px #1835540a}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #c7d8e6;max-width:100%}input{width:100%;background:#fbfdff}button{background:var(--navy);color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:white;color:var(--navy);border:1px solid #c7d8e6}button.danger{background:#a52333}button:disabled{opacity:.5;cursor:default}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.login{max-width:530px}#message{min-height:25px;color:#355576}.items{display:grid;gap:16px}.item{padding:22px;border:1px solid #dbe5ed;border-radius:17px;background:white;overflow-wrap:anywhere}.item h3{font-size:20px;margin:3px 0}.item p{margin:6px 0;white-space:pre-wrap}.muted{color:#64758a;font-size:14px}.tag{display:inline-block;border-radius:30px;background:#e8f7f4;color:#136b62;padding:4px 10px;font-size:13px;font-weight:800}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.toolbar input{max-width:340px}a{color:#08766e}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #21b6a8;outline-offset:2px}@media(max-width:640px){main{padding:23px 14px 70px}.toolbar input,.toolbar select{max-width:none;width:100%}.item{padding:18px}.toolbar>*{flex:1 1 100%}}</style></head><body><header><b>안성맞춤 릴리맘 · 문의 관리</b><a href="index.html">← 홈페이지로 돌아가기</a></header><main><h1>강의 문의 관리</h1><p>관리자에게만 공개되는 문의 목록입니다. 로그인 후 확인할 수 있습니다.</p><section class="panel login" id="loginPanel"><h2>관리자 로그인</h2><p>Supabase Authentication에 등록된 계정과 별도 관리자 권한이 필요합니다.</p><form id="loginForm"><label for="email">관리자 이메일</label><input id="email" type="email" autocomplete="username" required placeholder="관리자 이메일"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit" id="loginButton">로그인</button></p></form></section><section id="dashboard" hidden><div class="panel"><div class="row" style="justify-content:space-between"><div><h2>문의 목록</h2><div class="muted" id="count">조회 중</div></div><div class="row"><button class="secondary" id="refresh" type="button">새로고침</button><button class="secondary" id="logout" type="button">로그아웃</button></div></div><div class="toolbar"><input id="search" placeholder="기관명·담당자·주제 검색" aria-label="문의 검색"><select id="filter" aria-label="처리 상태 필터"><option value="all">모든 상태</option><option value="신규">신규</option><option value="확인">확인</option><option value="답변 완료">답변 완료</option></select></div><div id="items" class="items"></div></div></section><p id="message" role="status" aria-live="polite">안내: Supabase SQL 정책과 관리자 계정 설정을 마친 후 사용할 수 있습니다.</p></main><script>
const URL='https://ckelfnlerltdosqpfsnt.supabase.co', KEY='sb_publishable_E5Ll7i-OqBq4e9kKaYWIww_FcyNv-Nw';
let token=null,records=[];const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;
async function request(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok){let t=await r.text();throw new Error('요청 실패 ('+r.status+'): '+t.slice(0,250))}if(r.status===204||r.status===201&&r.headers.get('content-length')==='0')return null;const t=await r.text();return t?JSON.parse(t):null}
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;msg('로그인 확인 중...');try{const a=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=a.access_token;$('password').value='';await load();$('loginPanel').hidden=true;$('dashboard').hidden=false;msg('로그인했습니다. 관리자 권한이 부여된 계정만 문의를 볼 수 있습니다.');}catch(err){token=null;msg('로그인 또는 문의 조회 실패: '+err.message+' 관리자 권한 설정을 확인하세요.')}finally{$('loginButton').disabled=false}});
async function load(){const data=await request('/rest/v1/inquiries?select=*&order=created_at.desc&limit=500');records=data||[];render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),f=$('filter').value;const filtered=records.filter(r=>(f==='all'||r.status===f)&&[r.organization,r.contact_name,r.contact_email,r.topic,r.message].join(' ').toLocaleLowerCase().includes(q));$('count').textContent=`${filtered.length}건 표시 / 최근 최대 500건 조회`;const root=$('items');root.replaceChildren();if(!filtered.length){root.append(el('p','muted','표시할 문의가 없습니다.'));return}for(const r of filtered){const item=el('article','item'),head=el('div','row');head.append(el('span','tag',r.status),el('span','muted',new Date(r.created_at).toLocaleString('ko-KR')));item.append(head,el('h3','',r.organization+' · '+r.contact_name));for(const [label,value] of [['이메일',r.contact_email],['교육 대상',r.audience],['예상 인원',r.attendee_count??'미정'],['교육 주제',r.topic],['요청 사항',r.message||'없음']]){item.append(el('p','',label+': '+value))}const action=el('div','row');const select=el('select');select.setAttribute('aria-label','문의 처리 상태');for(const v of ['신규','확인','답변 완료']){const o=el('option','',v);o.value=v;select.append(o)}select.value=r.status;select.addEventListener('change',async()=>{select.disabled=true;try{await request('/rest/v1/inquiries?id=eq.'+encodeURIComponent(r.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:select.value})});r.status=select.value;msg('처리 상태를 변경했습니다.')}catch(e){select.value=r.status;msg(e.message)}finally{select.disabled=false}});const reply=el('a','','이메일 회신 ↗');reply.href='mailto:'+encodeURIComponent(r.contact_email)+'?subject='+encodeURIComponent('[AI 강의 문의 답변] '+r.organization);const del=el('button','danger','삭제');del.type='button';del.addEventListener('click',async()=>{if(!confirm('이 문의를 영구 삭제하시겠습니까?'))return;del.disabled=true;try{await request('/rest/v1/inquiries?id=eq.'+encodeURIComponent(r.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});records=records.filter(x=>x.id!==r.id);render();msg('삭제했습니다.')}catch(e){msg(e.message);del.disabled=false}});action.append(select,reply,del);item.append(action);root.append(item)}}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',async()=>{try{await load();msg('목록을 새로고침했습니다.')}catch(e){msg(e.message)}});$('logout').addEventListener('click',async()=>{try{await request('/auth/v1/logout',{method:'POST'})}catch(e){}token=null;records=[];$('dashboard').hidden=true;$('loginPanel').hidden=false;msg('로그아웃했습니다.')});
</script></body></html>
